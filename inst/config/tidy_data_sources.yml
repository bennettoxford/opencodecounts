# This file tells the R package where to download each ready-to-use dataset.
# New release tags use {dataset name with dashes}-v{version}, e.g. "gp-snomed-v0.2.0".
# Older URLs below keep their original published names.
#
# `publication` points at the matching inst/config/raw_<publication>.yml file;
# `variant` picks "usage" or "breakdowns" from a shared publication.
# `snomed_history` is the SNOMED CT History Substitution Table used by
# check_codelists(). It has no `variant` because it is not usage data.

datasets:
  gp_snomed:
    publication: gp_snomed
    variant: usage
    versions:
      - version: "0.2.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/gp-snomed-v0.2.0/gp_snomed.parquet"
      - version: "0.1.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/snomed-usage-v0.1.0/snomed_usage.parquet"
  hesapc_icd10:
    publication: hesapc_icd10
    variant: usage
    versions:
      - version: "0.2.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/hesapc-icd10-v0.2.0/hesapc_icd10.parquet"
      - version: "0.1.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/icd10-usage-v0.1.0/icd10_usage.parquet"
  hesapc_icd10_breakdowns:
    publication: hesapc_icd10
    variant: breakdowns
    versions:
      - version: "0.2.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/hesapc-icd10-breakdowns-v0.2.0/hesapc_icd10_breakdowns.parquet"
      - version: "0.1.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/icd10-usage-breakdowns-v0.1.0/icd10_usage_breakdowns.parquet"
  hesapc_opcs4:
    publication: hesapc_opcs4
    variant: usage
    versions:
      - version: "0.2.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/hesapc-opcs4-v0.2.0/hesapc_opcs4.parquet"
      - version: "0.1.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/opcs4-usage-v0.1.0/opcs4_usage.parquet"
  hesapc_opcs4_breakdowns:
    publication: hesapc_opcs4
    variant: breakdowns
    versions:
      - version: "0.2.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/hesapc-opcs4-breakdowns-v0.2.0/hesapc_opcs4_breakdowns.parquet"
      - version: "0.1.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/opcs4-usage-breakdowns-v0.1.0/opcs4_usage_breakdowns.parquet"
  snomed_history:
    publication: snomed_history
    versions:
      - version: "0.1.0"
        url: "https://github.com/bennettoxford/opencodecounts/releases/download/snomed-history-v0.1.0/snomed_history.parquet"
