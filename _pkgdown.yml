url: https://bennettoxford.github.io/opencodecounts/
title: OpenCodeCounts
template:
  bootstrap: 5
  includes:
    in_header: |
      <!-- Privacy-friendly analytics by Plausible -->
      <script async src="https://plausible.io/js/pa-Fyikfvowbj_Nbyof5VdGD.js"></script>
      <script>
        window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
        plausible.init()
      </script>
      <!-- Give the datasets table on the home page more room for the description column -->
      <style>
        .template-home table {
          table-layout: fixed;
          width: 100%;
        }
        .template-home table th:nth-child(2),
        .template-home table td:nth-child(2) {
          width: 50%;
        }
        .navbar-brand img {
          height: 2rem;
          width: auto;
        }
      </style>

reference:
- title: Datasets with total counts
  contents:
  - get_gp_snomed
  - get_hesapc_icd10
  - get_hesapc_opcs4
- title: Datasets with breakdowns
  contents:
  - get_hesapc_icd10_breakdowns
  - get_hesapc_opcs4_breakdowns
- title: Codelists
  contents:
  - get_codelist
- title: Shiny App
  contents:
  - run_app
- title: Helper functions
  contents:
  - extract_semantic_tag
  - strip_semantic_tag
- title: Cache management
  contents:
  - cache_info
  - cache_clear
  - available_versions
- title: Deprecated
  desc: Renamed; still work, but use the versions above instead.
  contents:
  - get_snomed_usage
  - get_icd10_usage
  - get_icd10_usage_breakdowns
  - get_opcs4_usage
  - get_opcs4_usage_breakdowns

navbar:
  structure:
    left: [home, reference, articles, launch_shiny]
    right: [search, github]

  components:
    reference:
      text: "Function reference"
      href: reference/index.html

    articles:
      text: "How-to guides"
      menu:
        - text: "How to use the Shiny app"
          href: articles/how-to-use-shiny-app.html
        - text: "How to use the R package"
          href: articles/how-to-use-R-pkg.html
        - text: "How to use ICD-10 and OPCS-4 breakdowns"
          href: articles/how-to-use-breakdowns.html
        - text: "How to extract SNOMED CT semantic tag in R"
          href: articles/extract-snomedct-sem-tag.html
        - text: "Learn about the available datasets"
          href: articles/available-datasets.html


    launch_shiny:
      text: "Launch Shiny App"
      href: articles/app.html
